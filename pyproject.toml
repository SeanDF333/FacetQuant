[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facetquant"
version = "0.1.0"
description = "Crystal instance segmentation and per-crystal area measurement"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "torch>=2.4",
  "torchvision>=0.19",
]

[project.optional-dependencies]
eval = ["pycocotools>=2.0.7", "scipy>=1.10"]

[project.scripts]
facetquant = "facetquant.cli:main"

[tool.setuptools.packages.find]
include = ["facetquant*"]
